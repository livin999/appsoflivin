<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apps of Livin</title>
<style>
  :root {
    --coral: #FF6248;
    --bg: #0f1115;
    --card: #171a21;
    --border: #262b35;
    --text: #f2f3f5;
    --muted: #9aa1ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 40px 28px 20px;
    text-align: center;
  }
  header h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; }
  header h1 span { color: var(--coral); }
  header p { color: var(--muted); margin: 0; }

  main { max-width: 960px; margin: 0 auto; padding: 28px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
  a.app-tile {
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  a.app-tile:hover { border-color: var(--coral); transform: translateY(-2px); }
  .app-tile img {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: cover;
  }
  .app-tile .name { font-weight: 600; font-size: 14px; }
  .app-tile .tag {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .app-tile.placeholder {
    color: var(--muted);
    border-style: dashed;
  }
  .app-tile.placeholder .name { color: var(--muted); font-weight: 500; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px; }
</style>
</head>
<body>

<header>
  <h1>Apps of <span>Livin</span></h1>
  <p>A hub for monitoring and managing every app in production.</p>
</header>

<main>
  <div class="grid">
    <a class="app-tile" href="apps/wome.html">
      <img src="assets/wome_logo.png" alt="WoMe icon" />
      <div class="name">WoMe</div>
      <div class="tag">Live</div>
    </a>

    <div class="app-tile placeholder">
      <div style="width:64px;height:64px;border-radius:16px;background:#1f232c;display:flex;align-items:center;justify-content:center;font-size:24px;">+</div>
      <div class="name">More soon</div>
    </div>
  </div>
</main>

<footer>appsoflivin — private portfolio &amp; monitoring hub</footer>

</body>
</html>
